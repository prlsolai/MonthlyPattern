name: Journal Price Updates
on:
  schedule:
    # every 15 minutes, 09:00-16:15 IST, Monday to Friday
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python fetch_prices.py
      - name: Commit prices
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || git commit -m "Prices update"
          git pull --rebase
          git push
